name: Deploy Next.js to VPS

on:
  push:
    branches: ["dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build to VPS (rsync)
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude node_modules --exclude .git --exclude .github
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_path: /var/www/paywise-frontend/app/
          path: "./"

      - name: Install prod deps + restart app (PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/paywise-frontend/app
            npm ci --omit=dev
            sudo -u deploy pm2 start ecosystem.config.js --update-env || sudo -u deploy pm2 reload ecosystem.config.js --update-env
            pm2 save
